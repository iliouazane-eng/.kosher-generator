<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל רישיונות - Kosher Data</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a202c; 
            color: white; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #2d3748; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { color: #4fd1c5; margin-bottom: 25px; font-size: 24px; }
        .input-group { text-align: right; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e0; font-weight: bold; }
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 2px solid #4a5568; 
            background: #1a202c; 
            color: white; 
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #4fd1c5; }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #0f766e; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { background: #0d635d; transform: translateY(-2px); }
        .result-box { 
            margin-top: 25px; 
            padding: 20px; 
            background: #1a202c; 
            border: 2px solid #4fd1c5; 
            border-radius: 10px; 
            display: none; 
        }
        .result-label { color: #a0aec0; font-size: 14px; margin-bottom: 10px; }
        .result-key { 
            font-size: 32px; 
            font-weight: bold; 
            color: #4fd1c5; 
            letter-spacing: 4px; 
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generator Kosher Data</h1>
        
        <div class="input-group">
            <label>מזהה מכשיר (HWID):</label>
            <input type="text" id="hwidInput" placeholder="הדבק כאן את המזהה שקיבלת...">
        </div>
        
        <button onclick="generateKey()">צור קוד אישור</button>

        <div id="resultArea" class="result-box">
            <div class="result-label">זה הקוד שעליך לשלוח ללקוח:</div>
            <div id="keyCode" class="result-key"></div>
        </div>
    </div>

    <script>
        // המפתח המוצפן (Base64) - חייב להיות זהה לזה שב-Electron
        const _0x5a1 = "SUxJT1VBWkFORzI2MDcxOTk5LS1PU0hSSVRDSEVMTDEwODA5MjAwMg==";

        async function generateKey() {
            const hwid = document.getElementById('hwidInput').value.trim();
            
            if (!hwid) {
                alert("בבקשה תדביק את המזהה שהלקוח שלח לך");
                return;
            }

            try {
                // פענוח ה-Salt
                const salt = atob(_0x5a1);
                
                // הכנת הנתונים להצפנה
                const encoder = new TextEncoder();
                const keyData = encoder.encode(salt);
                const msgData = encoder.encode(hwid);

                // ייבוא המפתח לשימוש ב-HMAC
                const cryptoKey = await crypto.subtle.importKey(
                    'raw', 
                    keyData, 
                    { name: 'HMAC', hash: 'SHA-256' }, 
                    false, 
                    ['sign']
                );

                // ביצוע ה-Hashing
                const signature = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
                
                // המרה לפורמט Hex
                const hashArray = Array.from(new Uint8Array(signature));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                // חיתוך ל-8 תווים ראשונים והפיכה לאותיות גדולות
                const finalKey = hashHex.substring(0, 8).toUpperCase();

                // הצגת התוצאה למשתמש
                document.getElementById('keyCode').innerText = finalKey;
                document.getElementById('resultArea').style.display = 'block';
                
            } catch (err) {
                console.error(err);
                alert("שגיאה ביצירת הקוד. בדוק את הקונסול.");
            }
        }
    </script>

</body>
</html>
