<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>מחולל רישיונות - Kosher Data</title>
    
    <!-- אופטימיזציה לאייפון -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --primary: #4fd1c5;
            --primary-dark: #0f766e;
            --text-main: #ffffff;
            --text-muted: #cbd5e0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100dvh; 
            overflow: hidden;
        }

        .container { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: env(safe-area-inset-bottom);
        }

        h1 { 
            color: var(--primary); 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .input-group { text-align: right; margin-bottom: 24px; }
        
        label { 
            display: block; 
            margin-bottom: 10px; 
            color: var(--text-muted); 
            font-weight: 600;
            font-size: 15px;
            padding-right: 4px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            border: 2px solid #4a5568; 
            background: #1a202c; 
            color: white; 
            font-size: 16px; 
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus { 
            border-color: var(--primary); 
        }

        button { 
            width: 100%; 
            padding: 18px; 
            background: var(--primary-dark); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.1s, background 0.2s;
            -webkit-tap-highlight-color: transparent; 
        }

        button:active { 
            transform: scale(0.97); 
            background: #0d635d;
        }

        .result-box { 
            margin-top: 25px; 
            padding: 20px; 
            background: rgba(26, 32, 44, 0.6); 
            border: 2px dashed var(--primary); 
            border-radius: 16px; 
            display: none; 
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label { color: #a0aec0; font-size: 14px; margin-bottom: 12px; }
        
        .result-key { 
            font-size: 32px; 
            font-weight: 900; 
            color: var(--primary); 
            letter-spacing: 3px; 
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
        }

        @media (max-height: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 20px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generator Kosher Data</h1>
        
        <div class="input-group">
            <label>מזהה מכשיר (HWID):</label>
            <input type="text" id="hwidInput" placeholder="הדבק כאן..." spellcheck="false" autocomplete="off">
        </div>
        
        <button onclick="generateKey()">צור קוד אישור</button>

        <div id="resultArea" class="result-box">
            <div class="result-label">קוד לשליחה ללקוח:</div>
            <div id="keyCode" class="result-key"></div>
        </div>
    </div>

    <script>
        const _0x5a1 = "SUxJT1VBWkFORzI2MDcxOTk5LS1PU0hSSVRDSEVMTDEwODA5MjAwMg==";

        async function generateKey() {
            const inputEl = document.getElementById('hwidInput');
            const hwid = inputEl.value.trim();
            
            if (!hwid) {
                alert("בבקשה תדביק את המזהה שהלקוח שלח לך");
                return;
            }

            inputEl.blur();

            try {
                const salt = atob(_0x5a1);
                const encoder = new TextEncoder();
                const keyData = encoder.encode(salt);
                const msgData = encoder.encode(hwid);

                const cryptoKey = await crypto.subtle.importKey(
                    'raw', 
                    keyData, 
                    { name: 'HMAC', hash: 'SHA-256' }, 
                    false, 
                    ['sign']
                );

                const signature = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
                const hashArray = Array.from(new Uint8Array(signature));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                const finalKey = hashHex.substring(0, 8).toUpperCase();

                document.getElementById('keyCode').innerText = finalKey;
                document.getElementById('resultArea').style.display = 'block';
                
            } catch (err) {
                console.error(err);
                alert("שגיאה ביצירת הקוד.");
            }
        }
    </script>

</body>
</html>
